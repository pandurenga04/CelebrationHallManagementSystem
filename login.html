<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="script.js"></script>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1601482441062-b9f13131f33a?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8d2VkZGluZyUyMGhhbGx8ZW58MHx8MHx8fDA%3D') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="overlay text-center">
            <h2 class="mb-4">User Login</h2>
            <form id="userLoginForm">
                <div class="mb-3 text-start">
                    <label class="form-label">Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Phone</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Address</label>
                    <input type="text" id="address" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Proceed to Booking</button>
            </form>
        </div>
    </div>
</body>
</html>
