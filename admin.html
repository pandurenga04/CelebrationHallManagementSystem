<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="admin.js"></script>
    <style>
        body {
            background: url('https://wallpapers.com/images/hd/indian-wedding-background-4upo9bz2i923c3dd.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }
        .overlay {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
        }
        .status-approved {
            color: #28a745;
            font-weight: bold;
        }
        .status-rejected {
            color: #dc3545;
            font-weight: bold;
        }
        .btn-approve {
            background-color: #28a745;
            border: none;
            color: white;
            padding: 8px 12px;
            cursor: pointer;
        }
        .btn-reject {
            background-color: #dc3545;
            border: none;
            color: white;
            padding: 8px 12px;
            cursor: pointer;
        }
        .btn-approve:hover {
            background-color: #218838;
        }
        .btn-reject:hover {
            background-color: #c82333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid white;
            text-align: center;
        }
        th {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="overlay text-center">
            <h2 class="mb-4">📊 Hi Admin, Here's Your Dashboard</h2>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Event</th>
                        <th>Dates</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingRequests">
                    <tr>
                        <td colspan="6">No booking requests available.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
