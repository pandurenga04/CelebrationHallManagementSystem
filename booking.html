<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Book a Hall </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="script.js"></script>
    <style>
        body {
            background: url('https://media.weddingz.in/images/20220913173859/Anais-Events-6-800x661.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }
        .overlay {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
        }
        h2 {
            color: #efe9cc;
        }
        .form-label {
            font-weight: bold;
            color: #FFDAB9;
        }
        .btn-primary {
            background: linear-gradient(45deg, #eea999, #FFBD33);
            border: none;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="overlay text-center">
            <h2 class="mb-4"> Book a Marriage Hall </h2>
            <form id="bookingForm">
                <div class="mb-3 text-start">
                    <label class="form-label">🎭 Event Type</label>
                    <select id="eventType" class="form-select">
                        <option value="1">🎂 Birthday</option>
                        <option value="2">💃 Reception</option>
                        <option value="3">💍 Engagement</option>
                        <option value="4">👰 Marriage</option>
                        <option value="5">🏛️ Exhibition</option>
                    </select>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">📅 From Date</label>
                    <input type="date" id="fromDate" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">📅 To Date</label>
                    <input type="date" id="toDate" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">⏰ From Time</label>
                    <input type="time" id="fromTime" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">⏰ To Time</label>
                    <input type="time" id="toTime" class="form-control" required>
                </div>
                <div class="mb-3">
                    <h4>💰 Price: <span id="price" class="text-warning">₹0</span></h4>
                </div>
                <button type="submit" class="btn btn-primary w-100"> Submit Booking</button>
            </form>
        </div>
    </div>
</body>
</html>
